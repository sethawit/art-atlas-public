services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: art_atlas
      POSTGRES_PASSWORD: art_atlas_dev
      POSTGRES_DB: art_atlas_dev
    ports:
      - "5432:5432"
    volumes:
      - art_atlas_pg_data:/var/lib/postgresql/data

volumes:
  art_atlas_pg_data:
